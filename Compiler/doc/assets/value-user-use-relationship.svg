<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .title { font: 700 44px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .subtitle { font: 400 22px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .card { fill: #f8f7ff; stroke: #a78bfa; stroke-width: 2.2; }
      .card-strong { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 2.4; }
      .example { fill: #fbfaff; stroke: #c4b5fd; stroke-width: 2; }
      .class-title { font: 700 29px "JetBrains Mono", "Consolas", monospace; fill: #4c1d95; }
      .section-title { font: 700 24px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #4c1d95; }
      .field { font: 500 19px "JetBrains Mono", "Consolas", monospace; fill: #1f2937; }
      .body { font: 500 19px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .code { font: 600 21px "JetBrains Mono", "Consolas", monospace; fill: #312e81; }
      .tag { font: 600 16px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #7c3aed; }
      .divider { stroke: #ddd6fe; stroke-width: 1.5; }
      .solid { fill: none; stroke: #7c3aed; stroke-width: 2.3; }
      .dash { fill: none; stroke: #8b5cf6; stroke-width: 2; stroke-dasharray: 7 7; }
      .thin { fill: none; stroke: #a78bfa; stroke-width: 1.8; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowLight" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="triangle" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M1,1 L12,6.5 L1,12 Z" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="96" y="78" class="title">Value / User / Use 关系</text>
  <text x="96" y="117" class="subtitle">同一个 Use：由 User 拥有，同时登记在被引用 Value 的使用链中</text>

  <!-- Class cards -->
  <rect x="110" y="180" width="490" height="260" rx="11" class="card"/>
  <text x="355" y="229" text-anchor="middle" class="class-title">Value</text>
  <line x1="140" y1="250" x2="570" y2="250" class="divider"/>
  <text x="155" y="292" class="field">irtype : shared_ptr&lt;IRType&gt;</text>
  <text x="155" y="329" class="field">ident / num</text>
  <text x="155" y="366" class="field">useList : UseList</text>
  <text x="155" y="412" class="small">记录“谁正在使用当前值”</text>

  <rect x="715" y="180" width="490" height="260" rx="11" class="card-strong"/>
  <text x="960" y="229" text-anchor="middle" class="class-title">Use</text>
  <line x1="745" y1="250" x2="1175" y2="250" class="divider"/>
  <text x="760" y="292" class="field">user : User*</text>
  <text x="760" y="329" class="field">usee : Value*</text>
  <text x="760" y="366" class="field">next : Use*</text>
  <text x="760" y="403" class="field">prev : Use**</text>

  <rect x="1320" y="180" width="490" height="260" rx="11" class="card"/>
  <text x="1565" y="229" text-anchor="middle" class="class-title">User : Value</text>
  <line x1="1350" y1="250" x2="1780" y2="250" class="divider"/>
  <text x="1365" y="292" class="field">userList</text>
  <text x="1365" y="329" class="field">vector&lt;unique_ptr&lt;Use&gt;&gt;</text>
  <text x="1365" y="378" class="small">每个 Use 对应一个有序操作数槽位</text>
  <text x="1365" y="412" class="small">Instruction 是最典型的 User</text>

  <!-- Relationships -->
  <path d="M1320 207 C1258 144, 662 144, 600 207" class="solid" marker-end="url(#triangle)"/>
  <text x="960" y="153" text-anchor="middle" class="tag">继承：User is-a Value</text>

  <path d="M1320 312 H1205" class="solid" marker-end="url(#arrow)"/>
  <text x="1262" y="295" text-anchor="middle" class="tag">独占拥有</text>
  <text x="1262" y="338" text-anchor="middle" class="small">userList</text>

  <path d="M715 305 H600" class="dash" marker-end="url(#arrowLight)"/>
  <text x="657" y="288" text-anchor="middle" class="tag">usee</text>
  <path d="M1205 378 H1320" class="dash" marker-end="url(#arrowLight)"/>
  <text x="1262" y="362" text-anchor="middle" class="tag">user</text>

  <path d="M355 440 V473 H835 V440" class="dash" marker-end="url(#arrowLight)"/>
  <text x="596" y="466" text-anchor="middle" class="tag">Value::useList 侵入式登记 Use</text>

  <!-- Example section -->
  <text x="96" y="532" class="section-title">实例：%sum = add i32 %a, %b</text>
  <rect x="76" y="558" width="1768" height="330" rx="12" class="example"/>

  <rect x="126" y="621" width="280" height="168" rx="9" class="card"/>
  <text x="266" y="666" text-anchor="middle" class="code">Value %a</text>
  <line x1="151" y1="684" x2="381" y2="684" class="divider"/>
  <text x="266" y="728" text-anchor="middle" class="field">useList.head</text>
  <text x="266" y="765" text-anchor="middle" class="small">被 operand[0] 使用</text>

  <rect x="492" y="621" width="280" height="168" rx="9" class="card-strong"/>
  <text x="632" y="666" text-anchor="middle" class="code">Use #0</text>
  <line x1="517" y1="684" x2="747" y2="684" class="divider"/>
  <text x="632" y="728" text-anchor="middle" class="field">usee = %a</text>
  <text x="632" y="765" text-anchor="middle" class="field">user = %sum</text>

  <rect x="1148" y="621" width="280" height="168" rx="9" class="card-strong"/>
  <text x="1288" y="666" text-anchor="middle" class="code">Use #1</text>
  <line x1="1173" y1="684" x2="1403" y2="684" class="divider"/>
  <text x="1288" y="728" text-anchor="middle" class="field">usee = %b</text>
  <text x="1288" y="765" text-anchor="middle" class="field">user = %sum</text>

  <rect x="1514" y="621" width="280" height="168" rx="9" class="card"/>
  <text x="1654" y="666" text-anchor="middle" class="code">Value %b</text>
  <line x1="1539" y1="684" x2="1769" y2="684" class="divider"/>
  <text x="1654" y="728" text-anchor="middle" class="field">useList.head</text>
  <text x="1654" y="765" text-anchor="middle" class="small">被 operand[1] 使用</text>

  <rect x="814" y="606" width="292" height="198" rx="10" class="card"/>
  <text x="960" y="650" text-anchor="middle" class="code">BinaryInst %sum</text>
  <text x="960" y="680" text-anchor="middle" class="tag">User / Instruction</text>
  <line x1="839" y1="699" x2="1081" y2="699" class="divider"/>
  <text x="960" y="737" text-anchor="middle" class="field">userList[0] → Use #0</text>
  <text x="960" y="773" text-anchor="middle" class="field">userList[1] → Use #1</text>

  <path d="M492 705 H406" class="dash" marker-end="url(#arrowLight)"/>
  <text x="449" y="689" text-anchor="middle" class="tag">登记</text>
  <path d="M1428 705 H1514" class="dash" marker-end="url(#arrowLight)"/>
  <text x="1471" y="689" text-anchor="middle" class="tag">登记</text>
  <path d="M814 746 H772" class="solid" marker-end="url(#arrow)"/>
  <path d="M1106 746 H1148" class="solid" marker-end="url(#arrow)"/>
  <text x="790" y="833" class="small">实线：所有权</text>
  <text x="1007" y="833" class="small">虚线：引用 / 使用链</text>

  <!-- RAUW footer -->
  <rect x="180" y="905" width="1560" height="75" rx="10" class="card-strong"/>
  <text x="220" y="947" class="code">oldValue.replaceAllUsesWith(newValue)</text>
  <path d="M760 950 H890" class="solid" marker-end="url(#arrow)"/>
  <text x="925" y="939" class="body">所有 Use 从 old.useList 换链到 new.useList</text>
  <text x="925" y="969" class="small">Use 对象与 User 中的操作数下标保持不变</text>
</svg>
