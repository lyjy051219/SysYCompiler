<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">PostDominant分析构建的后支配树</title>
  <desc id="desc">多出口CFG通过虚拟出口根转换成一棵后支配树。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 24px Inter,"Noto Sans SC",sans-serif;fill:#0f172a}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .label{font:700 18px Inter,"Noto Sans SC",sans-serif;fill:#334155}
      .node{fill:#fee2e2;stroke:#dc2626;stroke-width:2}
      .virtual{fill:#fef3c7;stroke:#d97706;stroke-width:2;stroke-dasharray:7 4}
      .text{font:600 15px Inter,"Noto Sans SC",sans-serif;fill:#0f172a;text-anchor:middle}
      .small{font:14px Inter,"Noto Sans SC",sans-serif;fill:#475569;text-anchor:middle}
      .edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
      .post{fill:none;stroke:#dc2626;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" class="title" text-anchor="middle">PostDominant：多出口CFG → PostDominatorTree</text>
  <rect x="28" y="58" width="444" height="420" rx="14" class="panel"/>
  <rect x="492" y="58" width="480" height="420" rx="14" class="panel"/>
  <text x="250" y="88" class="label" text-anchor="middle">原始CFG</text>
  <text x="732" y="88" class="label" text-anchor="middle">直接后支配树</text>
  <path d="M250 144 L155 202" class="edge"/>
  <path d="M250 144 L345 202" class="edge"/>
  <path d="M155 246 L155 330" class="edge"/>
  <path d="M345 246 L345 330" class="edge"/>
  <rect x="195" y="100" width="110" height="44" rx="9" class="node"/>
  <rect x="100" y="202" width="110" height="44" rx="9" class="node"/>
  <rect x="290" y="202" width="110" height="44" rx="9" class="node"/>
  <rect x="100" y="330" width="110" height="44" rx="9" class="node"/>
  <rect x="290" y="330" width="110" height="44" rx="9" class="node"/>
  <text x="250" y="127" class="text">Entry</text>
  <text x="155" y="229" class="text">Then</text>
  <text x="345" y="229" class="text">Else</text>
  <text x="155" y="357" class="text">ExitA</text>
  <text x="345" y="357" class="text">ExitB</text>
  <path d="M732 150 L570 212" class="post"/>
  <path d="M732 150 L732 212" class="post"/>
  <path d="M732 150 L894 212" class="post"/>
  <path d="M570 256 L570 336" class="post"/>
  <path d="M894 256 L894 336" class="post"/>
  <rect x="657" y="100" width="150" height="50" rx="10" class="virtual"/>
  <rect x="515" y="212" width="110" height="44" rx="9" class="node"/>
  <rect x="677" y="212" width="110" height="44" rx="9" class="node"/>
  <rect x="839" y="212" width="110" height="44" rx="9" class="node"/>
  <rect x="515" y="336" width="110" height="44" rx="9" class="node"/>
  <rect x="839" y="336" width="110" height="44" rx="9" class="node"/>
  <text x="732" y="130" class="text">VirtualExit</text>
  <text x="570" y="239" class="text">ExitA</text>
  <text x="732" y="239" class="text">Entry</text>
  <text x="894" y="239" class="text">ExitB</text>
  <text x="570" y="363" class="text">Then</text>
  <text x="894" y="363" class="text">Else</text>
</svg>
